<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      // mobile follows the system setting only — leave data-theme unset
      if (matchMedia("(max-width: 560px)").matches) return;
      var t = localStorage.getItem("theme");
      if (t !== "light" && t !== "dark") {
        t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <title>Larry Shi</title>
  <meta name="description" content="Larry Shi's work experience: Tangam Systems, Manulife, Geotab, and Xplore." />
  <link rel="icon" type="image/jpeg" href="assets/icons/images.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <main>
    <div class="wrap">
      <div class="page-head reveal-up">
        <h1 class="title">experience<span class="accent">.</span></h1>
        <nav class="nav card-nav" data-cardnav></nav>
      </div>
      <div class="exp-wrap reveal-up" data-delay="1" data-experience></div>
    </div>
  </main>

  <script src="assets/data.js"></script>

</body>
</html>
